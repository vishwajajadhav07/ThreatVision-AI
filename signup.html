<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThreatVision AI | Sign Up</title>

    <link rel="stylesheet" href="signup.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://kit.fontawesome.com/6b2d8cb6d4.js" crossorigin="anonymous"></script>

</head>

<body>

    <div class="container">

        <!-- Left Panel -->

        <div class="left-panel">

            <div class="overlay">

                <h1>ThreatVision <span>AI</span></h1>

                <p>

                    Join the next generation AI-powered cybersecurity platform.

                </p>

                <ul>

                    <li><i class="fa-solid fa-shield-halved"></i> AI Threat Detection</li>

                    <li><i class="fa-solid fa-chart-line"></i> Live Monitoring</li>

                    <li><i class="fa-solid fa-file-shield"></i> Threat Reports</li>

                    <li><i class="fa-solid fa-user-lock"></i> Secure Dashboard</li>

                </ul>

            </div>

        </div>

        <!-- Right Panel -->

        <div class="right-panel">

            <div class="signup-box">

                <h2>Create Account</h2>

                <p>Register to access ThreatVision AI.</p>

                <form id="signupForm">

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="fullname"
                            placeholder="Full Name"
                            required>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Email Address"
                            required>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required>

                        <i
                            class="fa-solid fa-eye"
                            id="togglePassword"></i>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm Password"
                            required>

                    </div>

                    <div class="options">

                        <label>

                            <input type="checkbox" id="terms">

                            I agree to the Terms & Conditions

                        </label>

                    </div>

                    <button type="submit">

                        Create Account

                    </button>

                </form>

                <p class="login">

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

                <p class="home">

                    <a href="index.html">

                        ← Back to Home

                    </a>

                </p>

            </div>

        </div>

    </div>

    <script src="signup.js"></script>

</body>

</html>
